<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="148" viewBox="0 0 1200 148" role="img"><title>Первая задача. А вопросов — ещё больше.</title><rect width="1200" height="148" fill="#FCFCFA"/><g font-family="Arial,Helvetica,sans-serif"><text x="8" y="25" font-size="13" font-weight="700" fill="#626362" letter-spacing="1.5">ЗНАКОМО?</text><rect x="0" y="47" width="842" height="50" fill="#CDEBFB"/><text x="8" y="83" font-size="38" font-weight="700" fill="#1C1C1C" >Первая задача. А вопросов — ещё больше.</text><text x="8" y="125" font-size="18" font-weight="400" fill="#626362" >Где искать знания, как получить доступ и кого спросить?</text></g></svg>