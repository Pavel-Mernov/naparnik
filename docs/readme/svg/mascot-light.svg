<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="148" viewBox="0 0 1200 148" role="img"><title>Напарник всегда рядом</title><rect width="1200" height="148" fill="#FCFCFA"/><g font-family="Arial,Helvetica,sans-serif"><text x="8" y="25" font-size="13" font-weight="700" fill="#626362" letter-spacing="1.5">ВАШ AI-BUDDY</text><rect x="0" y="47" width="471" height="50" fill="#CFFAC6"/><text x="8" y="83" font-size="38" font-weight="700" fill="#1C1C1C" >Напарник всегда рядом</text><text x="8" y="125" font-size="18" font-weight="400" fill="#626362" >На связи, думает, радуется ответу и засыпает, когда не нужен.</text></g></svg>