<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="232" viewBox="0 0 1200 232" role="img"><title>Меньше поисков. Больше ясности.</title><rect width="1200" height="232" fill="#FCFCFA"/><g font-family="Arial,Helvetica,sans-serif"><text x="8" y="28" font-size="14" font-weight="700" fill="#626362" letter-spacing="1.5">02 / ВОЗМОЖНОСТИ</text><text x="8" y="96" font-size="54" font-weight="700" fill="#1C1C1C" >Меньше поисков.</text><rect x="0" y="110" width="483" height="66" fill="#00D85F"/><text x="8" y="162" font-size="54" font-weight="700" fill="#1C1C1C" >Больше ясности.</text><text x="8" y="210" font-size="19" font-weight="400" fill="#626362" >Найти ответ, спросить человека, оформить заявку и двигаться дальше.</text></g></svg>