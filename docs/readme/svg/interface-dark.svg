<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="232" viewBox="0 0 1200 232" role="img"><title>Вот как выглядит день с Напарником</title><rect width="1200" height="232" fill="#1C1C1C"/><g font-family="Arial,Helvetica,sans-serif"><text x="8" y="28" font-size="14" font-weight="700" fill="#B7B7B3" letter-spacing="1.5">01 / ИНТЕРФЕЙС</text><text x="8" y="96" font-size="54" font-weight="700" fill="#FCFCFA" >Вот как выглядит</text><rect x="0" y="110" width="543" height="66" fill="#00D85F"/><text x="8" y="162" font-size="54" font-weight="700" fill="#1C1C1C" >день с Напарником</text><text x="8" y="210" font-size="19" font-weight="400" fill="#B7B7B3" >Шаги на сегодня, ответы и помощь — в одном приложении.</text></g></svg>