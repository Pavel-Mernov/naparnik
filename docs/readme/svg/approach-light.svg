<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="232" viewBox="0 0 1200 232" role="img" aria-label="Один процесс. Свой контекст команды."><title>Один процесс. Свой контекст команды.</title>
<rect x="0" y="0" width="1200" height="232" fill="#FCFCFA"/>
<g style="font-kerning:normal;font-variant-ligatures:common-ligatures" font-family="Onest, 'Golos Text', Inter, system-ui, sans-serif">
<text x="8" y="28" font-size="14" font-weight="700" fill="#626362" letter-spacing="1.5">ПОДХОД / АДАПТАЦИЯ</text>
<text x="8" y="96" font-size="54" font-weight="700" fill="#1C1C1C">Один процесс.</text>
<rect x="0" y="110" width="850" height="66" fill="#00D85F"/>
<text x="8" y="162" font-size="54" font-weight="700" fill="#1C1C1C">Свой контекст команды.</text>
<text x="8" y="210" font-size="19" font-weight="400" fill="#626362">Стандарт Авито — общий. Инструменты, знания и люди — свои у каждой команды.</text>
</g>
</svg>
