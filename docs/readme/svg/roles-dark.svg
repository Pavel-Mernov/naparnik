<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="232" viewBox="0 0 1200 232" role="img"><title>У каждого своя роль. Напарник помогает всем.</title><rect width="1200" height="232" fill="#1C1C1C"/><g font-family="Arial,Helvetica,sans-serif"><text x="8" y="28" font-size="14" font-weight="700" fill="#B7B7B3" letter-spacing="1.5">04 / КОМАНДА</text><text x="8" y="96" font-size="54" font-weight="700" fill="#FCFCFA" >У каждого своя роль.</text><rect x="0" y="110" width="703" height="66" fill="#9A5CF5"/><text x="8" y="162" font-size="54" font-weight="700" fill="#1C1C1C" >Напарник помогает всем.</text><text x="8" y="210" font-size="19" font-weight="400" fill="#B7B7B3" >Стажёру, бадди, эксперту и руководителю — с учётом их задач.</text></g></svg>