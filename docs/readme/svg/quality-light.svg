<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="232" viewBox="0 0 1200 232" role="img"><title>Красиво снаружи. Проверяемо внутри.</title><rect width="1200" height="232" fill="#FCFCFA"/><g font-family="Arial,Helvetica,sans-serif"><text x="8" y="28" font-size="14" font-weight="700" fill="#626362" letter-spacing="1.5">08 / ТЕХНОЛОГИИ И КАЧЕСТВО</text><text x="8" y="96" font-size="54" font-weight="700" fill="#1C1C1C" >Красиво снаружи.</text><rect x="0" y="110" width="576" height="66" fill="#9A5CF5"/><text x="8" y="162" font-size="54" font-weight="700" fill="#1C1C1C" >Проверяемо внутри.</text><text x="8" y="210" font-size="19" font-weight="400" fill="#626362" >Как устроен прототип, чем проверен и где проходят его границы.</text></g></svg>