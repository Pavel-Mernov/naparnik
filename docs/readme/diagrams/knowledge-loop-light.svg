<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="778" viewBox="0 0 1200 778" role="img"><title>Петля знаний: вопрос → база знаний → эксперт или бадди → ответ → статья → возврат в базу</title><rect x="0" y="0" width="1200" height="778" fill="#FCFCFA" /><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="38" fill="#008539" font-size="14" font-weight="700" letter-spacing="1.5">КИЛЛЕР-ФИЧА</text><rect x="36" y="54" width="272" height="47" fill="#00D85F" /><text x="43" y="90" fill="#1C1C1C" font-size="36" font-weight="700" >Петля знаний:</text><text x="40" y="140" fill="#1C1C1C" font-size="34" font-weight="700" >людям вопрос задают один раз</text><rect x="40" y="181" width="330" height="158" fill="#CFFAC6" /><text x="58" y="209" fill="#1C1C1C" font-size="15" font-weight="400" >01</text><text x="58" y="243" fill="#1C1C1C" font-size="25" font-weight="700" >Вопрос</text><text x="58" y="272" fill="#1C1C1C" font-size="17" font-weight="400" >Стажёр спрашивает маскота</text><text x="58" y="296" fill="#1C1C1C" font-size="17" font-weight="400" >в любой момент</text><rect x="435" y="181" width="330" height="158" fill="#00D85F" /><text x="453" y="209" fill="#1C1C1C" font-size="15" font-weight="400" >02</text><text x="453" y="243" fill="#1C1C1C" font-size="25" font-weight="700" >База знаний</text><text x="453" y="272" fill="#1C1C1C" font-size="17" font-weight="400" >Нашёл — ответ с источником,</text><text x="453" y="296" fill="#1C1C1C" font-size="17" font-weight="400" >автором и датой</text><rect x="830" y="181" width="330" height="158" fill="#1FAEEE" /><text x="848" y="209" fill="#1C1C1C" font-size="15" font-weight="400" >03</text><text x="848" y="243" fill="#1C1C1C" font-size="25" font-weight="700" >Эксперт</text><text x="848" y="272" fill="#1C1C1C" font-size="17" font-weight="400" >Подбор по авторству страниц.</text><text x="848" y="296" fill="#1C1C1C" font-size="17" font-weight="400" >ИИ готовит вопрос; отправка —</text><text x="848" y="320" fill="#1C1C1C" font-size="17" font-weight="400" >с согласия стажёра</text><rect x="830" y="488" width="330" height="158" fill="#CDEBFB" /><text x="848" y="516" fill="#1C1C1C" font-size="15" font-weight="400" >04</text><text x="848" y="550" fill="#1C1C1C" font-size="25" font-weight="700" >Бадди</text><text x="848" y="579" fill="#1C1C1C" font-size="17" font-weight="400" >Если эксперт не найден</text><text x="848" y="603" fill="#1C1C1C" font-size="17" font-weight="400" >или вопрос адресован</text><text x="848" y="627" fill="#1C1C1C" font-size="17" font-weight="400" >топ-руководителю</text><rect x="435" y="488" width="330" height="158" fill="#E4DDF6" /><text x="453" y="516" fill="#1C1C1C" font-size="15" font-weight="400" >05</text><text x="453" y="550" fill="#1C1C1C" font-size="25" font-weight="700" >Ответ</text><text x="453" y="579" fill="#1C1C1C" font-size="17" font-weight="400" >Текстом или встреча:</text><text x="453" y="603" fill="#1C1C1C" font-size="17" font-weight="400" >запись → транскрипт → выжимка</text><rect x="40" y="488" width="330" height="158" fill="#9A5CF5" /><text x="58" y="516" fill="#1C1C1C" font-size="15" font-weight="400" >06</text><text x="58" y="550" fill="#1C1C1C" font-size="25" font-weight="700" >Страница</text><text x="58" y="579" fill="#1C1C1C" font-size="17" font-weight="400" >Черновик в базе знаний.</text><text x="58" y="603" fill="#1C1C1C" font-size="17" font-weight="400" >Публикацию подтверждает</text><text x="58" y="627" fill="#1C1C1C" font-size="17" font-weight="400" >автор ответа</text><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#1C1C1C"/></marker><marker id="return" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#00D85F"/></marker></defs><g fill="none" stroke="#1C1C1C" stroke-width="2" marker-end="url(#arrow)"><path d="M375 259H424"/><path d="M770 259H819"/><path d="M995 345V477" stroke-dasharray="5 5"/><path d="M825 565H776"/><path d="M430 565H381"/><path d="M830 311H800V470H600V479"/></g><text x="797" y="243" fill="#626362" font-size="10" font-weight="400" text-anchor="middle">нет ответа</text><text x="1011" y="407" fill="#626362" font-size="13" font-weight="400" >если нужен</text><text x="1011" y="426" fill="#626362" font-size="13" font-weight="400" >бадди</text><path d="M205 479V412H400V269" fill="none" stroke="#00D85F" stroke-width="2.5" marker-end="url(#return)"/><text x="216" y="397" fill="#008539" font-size="17" font-weight="700" >возврат в базу</text><text x="435" y="380" fill="#1C1C1C" font-size="20" font-weight="700" >Петля замыкается.</text><text x="435" y="405" fill="#1C1C1C" font-size="18" font-weight="400" >Следующий стажёр получает ответ</text><text x="435" y="430" fill="#1C1C1C" font-size="18" font-weight="400" >из базы — без нового обращения</text><text x="435" y="455" fill="#1C1C1C" font-size="18" font-weight="400" >к эксперту или бадди.</text><path d="M40 683H1160" stroke="#DEDEDA"/><text x="40" y="717" fill="#626362" font-size="17" font-weight="400" >Права проверяет код · действия требуют подтверждения · источники сохраняют авторство</text><text x="40" y="748" fill="#626362" font-size="16" font-weight="400" >В прототипе запись и транскрипт встречи — демонстрационные данные.</text></g></svg>