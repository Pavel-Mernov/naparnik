# AI-buddy: сайт и API на http://localhost:8080
#
#   cp .env.example .env      # вписать ключ в LLM_API_KEY (без ключа работает заглушка модели)
#   docker compose up --build
#
# Фронт (frontend/web) отдаёт тот же Go-сервер — отдельный контейнер не нужен.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8080:8080"]
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
