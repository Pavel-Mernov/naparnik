# Напарник: интерфейс на http://localhost:3000, API на http://localhost:8080
#
#   cp .env.example .env      # вписать ключ в LLM_API_KEY (без ключа работает заглушка модели)
#   docker compose up --build
#
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: naparnik
      POSTGRES_PASSWORD: naparnik
      POSTGRES_DB: naparnik
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naparnik -d naparnik"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8080:8080"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://naparnik:naparnik@postgres:5432/naparnik?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["3000:3000"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
