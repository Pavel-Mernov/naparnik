# Напарник: интерфейс на http://localhost:3000, API на http://localhost:8080
#
#   cp .env.example .env      # вписать ключ в LLM_API_KEY (без ключа работает заглушка модели)
#   docker compose up --build
#
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: naparnik
      POSTGRES_PASSWORD: naparnik
      POSTGRES_DB: naparnik
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naparnik -d naparnik"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Кэш и очередь: одноразовые коды Telegram, лимит запросов к модели, блокировка отправки (стек Авито: PostgreSQL + Redis)
  redis:
    image: redis:7-alpine
    # AOF на томе: копия привязок Telegram (tg:link:*) переживает перезапуск и пересоздание состояния
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8080:8080"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://naparnik:naparnik@postgres:5432/naparnik?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      # Демо: уведомления в Telegram сразу, без ожидания рабочих часов и сводок. Для правил BR-20/BR-52 — false в .env
      NOTIFY_IGNORE_HOURS: ${NOTIFY_IGNORE_HOURS:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["3000:3000"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redis-data:
