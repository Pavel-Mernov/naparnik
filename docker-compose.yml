# Напарник: интерфейс на http://localhost:3000, API на http://localhost:8080
#
#   cp .env.example .env      # вписать ключ в LLM_API_KEY (без ключа работает заглушка модели)
#   docker compose up --build
#
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8080:8080"]
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["3000:3000"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
