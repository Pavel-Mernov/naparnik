# Проверки на каждый пуш и PR: Go-бэкенд (vet, тесты, покрытие > 80%), сборка Docker.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: backend — vet, тесты, покрытие
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      LLM_PROVIDER: ""   # тесты не зависят от внешней модели
      LLM_MODE: stub_ok
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: go vet ./...
      - name: Тесты и покрытие
        run: |
          go test ./... -coverprofile=coverage.out -coverpkg=./internal/...,./cmd/buddy
          go tool cover -func=coverage.out | tail -1
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print substr($3, 1, length($3)-1)}')
          awk -v t="$total" 'BEGIN { if (t < 80) { print "Покрытие " t "% < 80%"; exit 1 } }'
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.out

  docker:
    name: Docker-образ бэкенда
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile .
