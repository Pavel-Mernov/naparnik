# Проверки на каждый пуш и PR: Go-бэкенд (vet, тесты, покрытие > 80%), сборка Docker.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: frontend — RTL, Vitest, coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Unit, functional and integration tests (coverage >= 80%)
        run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

  backend:
    name: backend — vet, тесты, покрытие
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: naparnik
          POSTGRES_PASSWORD: naparnik
          POSTGRES_DB: naparnik
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U naparnik -d naparnik"
          --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      LLM_PROVIDER: ""   # тесты не зависят от внешней модели
      LLM_MODE: stub_ok
      TEST_DATABASE_URL: postgres://naparnik:naparnik@localhost:5432/naparnik?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: gofmt (docs/CODESTYLE.md)
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Конкурентные операции и PostgreSQL
        # Мок-данные находятся вне backend: Go не отслеживает их в кеше тестов.
        run: go test -race -count=1 ./...
      - name: Тесты и покрытие
        run: |
          go test -count=1 ./... -coverprofile=coverage.out -coverpkg=./internal/...,./cmd/buddy
          go tool cover -func=coverage.out | tail -1
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print substr($3, 1, length($3)-1)}')
          awk -v t="$total" 'BEGIN { if (t < 80) { print "Покрытие " t "% < 80%"; exit 1 } }'
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.out

  docker:
    name: Docker Compose — все образы
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-acceptance.txt
      - run: python -m pip install -r scripts/requirements-acceptance.txt
      - run: python -m playwright install --with-deps chromium
      - name: Собранный стенд с отдельными тестовыми томами
        run: docker compose -p naparnik-acceptance -f docker-compose.yml -f docker/compose.acceptance.yml up -d --build --wait
      - name: Приёмка по ролям, перезапуск и сбои
        run: python scripts/test_mvp_acceptance.py
      - name: Логи при ошибке
        if: failure()
        run: |
          mkdir -p .artifacts/acceptance
          docker compose -p naparnik-acceptance -f docker-compose.yml -f docker/compose.acceptance.yml logs --no-color > .artifacts/acceptance/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvp-acceptance
          path: .artifacts/acceptance
      - name: Очистить только стенд приёмки
        if: always()
        run: docker compose -p naparnik-acceptance -f docker-compose.yml -f docker/compose.acceptance.yml down --volumes --remove-orphans
