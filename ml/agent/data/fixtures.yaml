# Статьи базы знаний по отделам (имитация пространства Confluence)
knowledge:
  backend:
    - title: "Шаталити"
      source: "Чек-лист стажёра Авито, вкладка «Чек-лист Backend»"
      demo: false
      text: "Шаталити — процесс, который помогает планировать свои задачи и делать так, чтобы плановые работы на разных сервисах не совпадали по времени."
    - title: "Релизы и release train"
      source: "AvitoTech Playbook, «Процессы и стандарты»"
      demo: false
      text: "Релизы идут по модели release train: сайт выпускается два раза в день, мобильные приложения — раз в две недели. Команды со своими микросервисами работают в Continuous Delivery."
    - title: "SPT: работа с обращениями пользователей"
      source: "AvitoTech Playbook, раздел SPT"
      demo: false
      text: "SPT — процесс работы с обращениями пользователей. Подробности — в разделе Playbook «SPT: работа с обращениями пользователей»."
    - title: "Как настроить avito-cli"
      source: "Демо-регламент юнита «Доставка»"
      demo: true
      text: "Установи avito-cli по инструкции в пространстве юнита, авторизуйся корпоративной учёткой и проверь доступ командой статуса. Если не получается — спроси наставника."
  frontend:
    - title: "Bottom sheet"
      source: "Статья «Как устроена библиотека дизайн-системы Авито в Фигме», Хабр"
      demo: false
      text: "Bottom sheet — мобильный компонент дизайн-системы. Его гайдлайн описывает выбор варианта, высоту, анимацию, футер, отступы, кнопки и примеры «как не надо»."
  analytics:
    - title: "Где смотреть clickstream"
      source: "Демо-регламент юнита «Монетизация»"
      demo: true
      text: "Сырые события clickstream доступны в хранилище через Trino, готовые дашборды — в Redash в папке юнита."

glossary:
  - {term: "Шаталити", definition: "Процесс планирования плановых работ, чтобы работы на разных сервисах не совпадали по времени.", source: "Чек-лист стажёра Авито", demo: false}
  - {term: "ZBP", definition: "Zero Bug Policy — политика работы с багами; подробности в материалах юнита.", source: "Чек-лист стажёра Авито", demo: false}
  - {term: "LSR", definition: "Live Site Review — разбор инцидентов в проде с постмортемом и action items.", source: "AvitoTech Playbook", demo: false}
  - {term: "PaaS", definition: "Платформа разработки Авито для запуска и эксплуатации сервисов.", source: "AvitoTech Playbook", demo: false}
  - {term: "Экватор", definition: "Встреча после 3 месяцев стажировки: стажёр показывает промежуточные результаты.", source: "Чек-лист стажёра Авито", demo: false}

absence_rules:
  отгул: {text: "Отгул согласуется с руководителем не позже чем за 2 рабочих дня. Заявка подаётся в сервисе отсутствий.", min_days_ahead: 2, source: "Демо-регламент прототипа", demo: true}
  отпуск: {text: "Отпуск подаётся не позже чем за 14 дней и согласуется с руководителем.", min_days_ahead: 14, source: "Демо-регламент прототипа", demo: true}

